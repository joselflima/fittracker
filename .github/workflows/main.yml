name: FitTracker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes e lint
        run: make check
      - name: Build de produção
        run: docker build --target production -t fittracker:ci .
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: fittracker-production
      cancel-in-progress: false
    steps:
      - name: Implantar revisão testada na VPS
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/fittracker
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i ~/.ssh/fittracker fittracker-ci@srv1625057.hstgr.cloud "$GITHUB_SHA"
      - name: Verificar HTTPS público
        run: curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 5 https://fittracker.srv1625057.hstgr.cloud/up
